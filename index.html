<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busan Private Concierge</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* 모바일/PC에서 텍스트 선택 및 드래그 방지 */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: #161616;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #222;
        }
        .image-container {
            width: 100%;
            height: 320px;
            position: relative;
            overflow: hidden;
        }
        .slides {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.4s ease-in-out;
        }
        .slides img {
            width: 100%;
            height: 100%;
            flex-shrink: 0;
            object-fit: cover;
            /* 이미지 드래그 방지 */
            pointer-events: none;
        }
        .image-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(to top, #161616, transparent);
            pointer-events: none;
        }
        .dots {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 10;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: background 0.3s;
        }
        .dot.active {
            background: #d4af37;
        }
        .content {
            padding: 20px 25px 30px 25px;
        }
        h2 {
            margin: 0 0 5px 0;
            font-size: 22px;
            letter-spacing: 0.5px;
            color: #f3f3f3;
        }
        .subtitle {
            font-size: 13px;
            color: #d4af37;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 5px;
        }
        select, input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #222;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #d4af37;
        }
        button {
            width: 100%;
            background: #d4af37;
            color: #000;
            border: none;
            padding: 14px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s;
            margin-top: 5px;
        }
        button:active {
            background: #b8972e;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="image-container" id="sliderContainer">
            <div class="slides" id="slidesTrack">
                <img src="model1.jpg" alt="Concierge Preview 1">
                <img src="model2.jpg" alt="Concierge Preview 2">
                <img src="model3.png" alt="Concierge Preview 3">
                <img src="model4.png" alt="Concierge Preview 4">
            </div>
            <div class="dots" id="dotsContainer">
                <span class="dot active" onclick="currentSlide(0)"></span>
                <span class="dot" onclick="currentSlide(1)"></span>
                <span class="dot" onclick="currentSlide(2)"></span>
                <span class="dot" onclick="currentSlide(3)"></span>
            </div>
        </div>
        <div class="content">
            <h2>Busan Nightlife</h2>
            <div class="subtitle">Exclusive VIP Curation</div>

            <label>Party Size</label>
            <select id="partySize">
                <option value="Solo">Solo Explorer</option>
                <option value="Duo">Duo / Business Partners</option>
                <option value="Small Group">Small Group (3-4)</option>
                <option value="VIP Crew">VIP Crew (5+)</option>
            </select>

            <label>Preferred Vibe</label>
            <select id="vibe">
                <option value="Casual Bar">Casual Lounge & Bar</option>
                <option value="Dynamic Night">Dynamic & Private Room</option>
                <option value="Ultimate VIP">Ultimate VIP Experience</option>
            </select>

            <label>Hotel Name</label>
            <input type="text" id="hotelInput" placeholder="e.g., Signiel Busan">

            <label>WhatsApp Number</label>
            <input type="text" id="whatsappInput" placeholder="+1 ...">

            <button onclick="submitData()">Request Access</button>
        </div>
    </div>

    <script>
        // 마우스 오른쪽 클릭(컨텍스트 메뉴) 차단
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // 주요 개발자 도구 단축키 차단 (F12, Ctrl+Shift+I, Ctrl+U 등)
        document.addEventListener('keydown', function(e) {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
                (e.ctrlKey && e.key === 'U')
            ) {
                e.preventDefault();
            }
        });

        let currentIndex = 0;
        const track = document.getElementById('slidesTrack');
        const slides = track.getElementsByTagName('img');
        const totalSlides = slides.length;
        const dots = document.getElementsByClassName('dot');
        let autoSlideTimer;

        function updateSlidePosition() {
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            for (let i = 0; i < dots.length; i++) {
                dots[i].classList.remove('active');
            }
            dots[currentIndex].classList.add('active');
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % totalSlides;
            updateSlidePosition();
        }

        function currentSlide(index) {
            currentIndex = index;
            updateSlidePosition();
            resetAutoSlide();
        }

        function resetAutoSlide() {
            clearInterval(autoSlideTimer);
            autoSlideTimer = setInterval(nextSlide, 3500);
        }

        // 자동 슬라이드 시작 (3.5초 간격)
        autoSlideTimer = setInterval(nextSlide, 3500);

        // 터치/마우스 스와이프 기능 구현
        let startX = 0;
        let isDragging = false;

        track.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
            clearInterval(autoSlideTimer);
        });

        track.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
        });

        track.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            const endX = e.changedTouches[0].clientX;
            const diff = startX - endX;

            if (diff > 50) {
                currentIndex = (currentIndex + 1) % totalSlides;
            } else if (diff < -50) {
                currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
            }
            updateSlidePosition();
            isDragging = false;
            resetAutoSlide();
        });

        track.addEventListener('mousedown', (e) => {
            startX = e.clientX;
            isDragging = true;
            clearInterval(autoSlideTimer);
        });

        track.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            const endX = e.clientX;
            const diff = startX - endX;

            if (diff > 50) {
                currentIndex = (currentIndex + 1) % totalSlides;
            } else if (diff < -50) {
                currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
            }
            updateSlidePosition();
            isDragging = false;
            resetAutoSlide();
        });

        async function submitData() {
            const formData = {
                partySize: document.getElementById('partySize').value,
                vibe: document.getElementById('vibe').value,
                hotel: document.getElementById('hotelInput').value,
                whatsapp: document.getElementById('whatsappInput').value
            };

            const webAppUrl = 'https://script.google.com/macros/s/AKfycbxP0c9yBakkaP2l8gAjWcPu2qCUJ-m_nvNtGtFxSgy19tWrbRzBD6Wjc1fE_tfHdQRDvg/exec';

            if(webAppUrl.includes('AKfycbx...')) {
                alert("Please insert your Google Web App URL first!");
                return;
            }

            if (navigator.vibrate) {
                navigator.vibrate(50);
            }

            try {
                let response = await fetch(webAppUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                alert("Request received. Our concierge will contact you via WhatsApp shortly.");
            } catch (error) {
                console.error('Error:', error);
                alert("Submission failed. Please check console.");
            }
        }
    </script>
</body>
</html>
